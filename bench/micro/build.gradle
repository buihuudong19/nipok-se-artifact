// crypto-jmh — benchmark Ed25519 (keygen/sign/verify) qua nhiều cài đặt Java.
// Tách hoàn toàn khỏi auth-server; chỉ là công cụ đo, không phải code production.
plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.2'   // JMH source set + jmhJar task
}

group = 'se.magnus.bench'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)   // khớp runtime auth-server (Temurin 24)
    }
}

repositories { mavenLocal(); mavenCentral() }   // mavenLocal: psu-auth-spi (NIPoK) publish từ bank build

// Thư viện crypto cho src/jmh (KHÔNG vào production). Mỗi impl được guard bằng available()
// nên thiếu native (libsodium/conscrypt) chỉ làm case đó bị SKIP, không vỡ cả run.
dependencies {
    jmhImplementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'        // BouncyCastle (lightweight + JCA)
    jmhImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'        // X509v3CertificateBuilder (dựng cert Ed25519 cho PSU-mTLS bench)
    jmhImplementation 'com.google.crypto.tink:tink:1.13.0'           // Google Tink (subtle Ed25519)
    jmhImplementation 'com.goterl:lazysodium-java:5.1.4'             // libsodium qua JNA
    jmhImplementation 'net.java.dev.jna:jna:5.14.0'
    jmhImplementation 'org.conscrypt:conscrypt-openjdk-uber:2.6-alpha'   // BoringSSL qua JCA provider (2.6+ thêm Ed25519)
    // P5 NIPoK — crypto prove/verify DÙNG CHUNG server/client (elisabeth + Conscrypt-SHA512).
    jmhImplementation 'com.openbanking:psu-auth-spi:1.0.0'
    // libsodium-panama-ffm: KHÔNG cần dependency (java.lang.foreign built-in JDK 22+),
    //   nhưng cần libsodium.so trên hệ thống + cờ --enable-native-access.
}

jmh {
    warmupIterations = 5
    iterations = 8
    fork = 2
    timeUnit = 'us'
    // Cờ cho FFM (Panama) gọi native trên JVM con mà JMH fork ra:
    jvmArgsAppend = ['--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow']
}
