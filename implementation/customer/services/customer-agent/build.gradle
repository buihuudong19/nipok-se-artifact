plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.openbanking.services.agent.customer'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

repositories {
	mavenLocal()    // psu-auth-spi (crypto NIPoK dùng chung server/client) publish từ bank build
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// Prometheus cho metric journey (P4) — đồng bộ các service khác.
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// jsoup: scrape form login + consent (thay vai browser parse HTML).
	implementation 'org.jsoup:jsoup:1.18.1'
	// P5 NIPoK — crypto prove (SimulatorWalletProvider/NipokEngine/Ed25519Group) DÙNG CHUNG với
	// auth-server (verify). Build bank publishToMavenLocal trước (xem 02-deploy-customer-agent.sh).
	implementation 'com.openbanking:psu-auth-spi:1.0.0'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
