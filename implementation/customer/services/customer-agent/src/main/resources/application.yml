server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: customer-agent
  lifecycle:
    timeout-per-shutdown-phase: 10s

# customer-agent = PSU/browser headless. Override qua env khi deploy.
customer:
  agent:
    tpp-base-url: "${AGENT_TPP_BASEURL:https://tpp.openbanking.dev}"
    bank-base-url: "${AGENT_BANK_BASEURL:https://bank.openbanking.dev}"
    # G1 — TLS hardening. insecure-tls=false (production) cần cert gateway SAN=bank.openbanking.dev + Root-CA.
    insecure-tls: ${AGENT_INSECURE_TLS:true}
    # PEM Root-CA Bank (mount ConfigMap) để validate chain khi insecure-tls=false. Rỗng = system trust.
    bank-ca-path: "${AGENT_BANK_CA_PATH:}"
    # G4.1 — PEM CA validate TPP server cert (tpp-onboarding-ca). Rỗng = system trust.
    tpp-ca-path: "${AGENT_TPP_CA_PATH:}"
    # G4.2 — PKCS12 workload cert agent TRÌNH cho Bank+TPP (mutual TLS). Rỗng = không trình.
    workload-cert-path: "${AGENT_WORKLOAD_CERT_PATH:}"
    workload-cert-pass: "${AGENT_WORKLOAD_CERT_PASS:changeit}"
    psu:
      # Cơ chế PSU đang BẬT (A/B đo lường): password | nipok
      method: "${AGENT_PSU_METHOD:password}"
      username: "${AGENT_PSU_USERNAME:u}"
      password: "${AGENT_PSU_PASSWORD:p}"
    # PSU-mTLS (RFC 8410) — PKCS12 cert+key Ed25519 của PSU (đã enroll ở Bank). Agent TRÌNH ở phiên TLS
    # tới Bank tại /oauth2/authorize ⟹ MtlsPreAuthFilter xác thực (thay password/NIPoK). Mount Secret.
    mtls:
      cert-path: "${AGENT_PSU_MTLS_CERT_PATH:}"
      cert-pass: "${AGENT_PSU_MTLS_CERT_PASS:changeit}"
    # PSU-Private-Key-JWT (RFC 7523/8037) — seed Ed25519 32B (base64url) ký JWT assertion. seed-path
    # (Secret tmpfs) ưu tiên hơn seed inline. audience PHẢI khớp APP_PSU_JWT_AUDIENCE ở Bank.
    jwt:
      seed: "${AGENT_PSU_JWT_SEED:}"
      seed-path: "${AGENT_PSU_JWT_SEED_PATH:}"
      audience: "${AGENT_PSU_JWT_AUDIENCE:https://bank.openbanking.dev}"
      lifetime-seconds: ${AGENT_PSU_JWT_LIFETIME:60}
      # Backend ký: SunEC (mặc định) | elisabeth (đồng nhất thư viện ký với NIPoK prove — đo công bằng).
      signature-provider: "${AGENT_PSU_JWT_SIGNATURE_PROVIDER:SunEC}"
    # PSU-Pure-EdDSA (RFC 8032) — seed Ed25519 32B (base64url) ký thông điệp chính tắc M. seed-path
    # (Secret tmpfs) ưu tiên hơn seed inline. audience + verifier-id PHẢI khớp Bank (app.psu.eddsa.*).
    eddsa:
      seed: "${AGENT_PSU_EDDSA_SEED:}"
      seed-path: "${AGENT_PSU_EDDSA_SEED_PATH:}"
      audience: "${AGENT_PSU_EDDSA_AUDIENCE:openbanking-bank-as}"
      verifier-id: "${AGENT_PSU_EDDSA_VERIFIERID:bank}"
      # Backend ký: SunEC | elisabeth (đồng nhất thư viện ký với NIPoK) | libsodium (NATIVE FFM).
      signature-provider: "${AGENT_PSU_EDDSA_SIGNATURE_PROVIDER:elisabeth}"
    # PSU-ML-DSA-65 (FIPS 204, hậu lượng tử) — private key PKCS8 (base64url ~4060B) ký M. private-key-path
    # (Secret tmpfs) ưu tiên hơn inline. audience + verifier-id PHẢI khớp Bank (app.psu.mldsa.*).
    mldsa:
      private-key: "${AGENT_PSU_MLDSA_PRIVATEKEY:}"
      private-key-path: "${AGENT_PSU_MLDSA_PRIVATEKEY_PATH:}"
      audience: "${AGENT_PSU_MLDSA_AUDIENCE:openbanking-bank-as}"
      verifier-id: "${AGENT_PSU_MLDSA_VERIFIERID:bank}"
      # Backend ký: sunjce (JDK24 built-in, mặc định) | bc (BouncyCastle 1.79).
      backend: "${AGENT_PSU_MLDSA_BACKEND:sunjce}"
    # PSU-Schnorr TƯƠNG TÁC (3-pass) — scalar x (base64url 32B). ĐỘC LẬP NIPoK (custody/code riêng).
    # private-key-path (Secret tmpfs) ưu tiên hơn inline.
    schnorr:
      private-key: "${AGENT_PSU_SCHNORR_PRIVATEKEY:}"
      private-key-path: "${AGENT_PSU_SCHNORR_PRIVATEKEY_PATH:}"
    # NIPoK (RFC 8235) — scalar x của PSU (base64url) + verifierId khớp Bank (app.psu.nipok.verifier-id).
    nipok:
      # G11 — ưu tiên đọc x từ FILE Secret-mount (tmpfs, không vào etcd/deploy-spec plaintext);
      # fallback inline env (tương thích cũ). custody-mode: sealed (mặc định e2e) | resident (JMH micro-bench).
      private-key-path: "${AGENT_NIPOK_PRIVATEKEY_PATH:}"
      private-key: "${AGENT_NIPOK_PRIVATEKEY:}"
      custody-mode: "${AGENT_NIPOK_CUSTODY_MODE:sealed}"
      verifier-id: "${AGENT_NIPOK_VERIFIERID:bank}"
      # Backend đại số: elisabeth (mặc định) | libsodium (NATIVE FFM — agent PROVE nhanh 2.8×).
      # Cần libsodium.so + --enable-native-access (đã có trong Dockerfile). Thiếu → tự fallback elisabeth.
      group: "${AGENT_NIPOK_GROUP:elisabeth}"

management:
  endpoints.web.exposure.include: "*"
  endpoint.health.show-details: "ALWAYS"
  endpoint.health.probes.enabled: true

logging:
  level:
    root: INFO
    com.openbanking.services.agent.customer: INFO
