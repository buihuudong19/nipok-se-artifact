plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.openbanking.services.tpp'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// BouncyCastle: builds the CSR (PKCS#10) signed by an external signer (Vault Transit) - key custody.
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
	// JARM: JWE decryption (X25519/ECDH-ES) + JWS verification (Ed25519). Nimbus OKP needs Tink.
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
	implementation 'com.google.crypto.tink:tink:1.13.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
