spring:
  application:
    name: transaction
server.port: 7007
server.error.include-message: always
spring.jpa.hibernate.ddl-auto: update

spring.datasource:
  url: jdbc:sqlserver://localhost:1433;databaseName=transaction-db;encrypt=false;trustServerCertificate=true
  username: sa
  password: ${MSSQL_SA_PASSWORD:}

spring.datasource.hikari.initializationFailTimeout: 60000

logging:
  level:
    root: INFO
    com.openbanking: DEBUG

management.endpoint.health.probes.enabled: true
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 10s
---
spring.config.activate.on-profile: docker

server.port: 80

spring.datasource:
  url: jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_TRANSACTION_DATABASE};encrypt=false;trustServerCertificate=true
  username: sa
  password: ${MSSQL_SA_PASSWORD}
