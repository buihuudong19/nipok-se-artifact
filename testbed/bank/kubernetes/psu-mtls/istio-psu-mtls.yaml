# =============================================================================
# istio-psu-mtls.yaml - Ingress configuration for PSU-mTLS (Ed25519, TLS 1.3, RFC 8410)
#
# GOAL: the Envoy IngressGateway performs the mTLS handshake with the PSU (verifies the Ed25519 certificate against the
# bank PSU CA), then FORWARDS the certificate chain to the auth-server in the header X-Forwarded-Client-Cert (XFCC).
#
# RELATION TO THE EXISTING INFRASTRUCTURE (helm/common/templates/_istio_base.yaml):
#   - the Gateway bank-cluster-gw is already OPTIONAL_MUTUAL + TLSV1_3 -> unchanged; ONLY the PSU CA is added
#     to the trust (caCertificates) so that Envoy accepts the Ed25519 client certificate of the PSU.
#   - the ingress EnvoyFilter already applies SANITIZE_SET (removes forged XFCC) + sets subject/cert/chain -> unchanged.
#   - the EnvoyFilter of the auth-server sidecar is already FORWARD_ONLY -> unchanged.
#   - Ed25519 mTLS is feasible only at the EDGE (Envoy verifies the leaf), NOT with mesh mTLS (the mesh supports only RSA/ECDSA).
#
# HOW TO APPLY: the secret 'bank-cluster-certificate' (istio-system) must contain the extra key 'cacert'=ca.crt
# of the bank PSU CA. OPTIONAL_MUTUAL then verifies the client certificate against this CA. (See the set-up script.)
# =============================================================================
---
# Gateway patch (illustrates only the tls part - merge it into the https server of bank-cluster-gw).
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: bank-cluster-gw
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - bank.openbanking.dev
      port:
        name: https
        number: 443
        protocol: HTTPS
      tls:
        # The server certificate of the bank and the CA trusted for PSU client certificates are in the SAME secret
        # (key 'cacert'). OPTIONAL_MUTUAL: verifies the certificate if the client presents one, without requiring it
        # => A/B testing: password/nipok work WITHOUT a certificate; only mtls attaches one.
        credentialName: bank-cluster-certificate
        mode: OPTIONAL_MUTUAL
        minProtocolVersion: TLSV1_3          # RFC 8410 Ed25519 + TLS 1.3 only
---
# (REFERENCE - already in _istio_base.yaml) EnvoyFilter forwarding XFCC at the ingress.
# Kept here to document the complete certificate flow; if it already exists, do NOT apply it twice.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingress-xfcc-psu-mtls
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            # SANITIZE_SET: REMOVES any XFCC sent by an external client, then WRITES the value verified by Envoy
            # (against spoofing). Forwards Subject + Cert (leaf PEM) + Chain (full chain) to the application.
            forward_client_cert_details: SANITIZE_SET
            set_current_client_cert_details:
              subject: true
              cert: true
              chain: true
              dns: true
---
# AuthorizationPolicy: only the IngressGateway may call the PSU-mTLS front channel of the auth-server
# => an ordinary pod CANNOT inject a forged XFCC towards the auth-server (delegated-trust boundary).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-auth-server-psu-mtls
  namespace: bank-cluster-nsp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-server
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            paths: ["/oauth2/authorize", "/psu/login-page"]
