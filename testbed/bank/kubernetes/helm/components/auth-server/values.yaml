fullnameOverride: auth-server

image:
  name: auth-server

ports:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

env:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"
  APP_ISSUER_URI: "http://auth-server:80"
  APP_JWK_SET_PATH: "/etc/auth/jwk-set.json"
  # JARM: K5 (Ed25519 signing key, private part) + K6 (X25519 public key of the TPP). Secret 'auth-server-jarm'
  # mounted at /etc/jarm - FULLY SEPARATE from the secret 'auth-server-jwk' (token key). Generated by generate-jarm-keys.sh.
  APP_JARM_SIGNING_JWK_PATH: "/etc/jarm/jarm-signing.jwk"
  APP_JARM_TPP_ENC_JWK_PATH: "/etc/jarm/tpp-enc-pub.jwk"
  APP_JARM_CLIENT_ID: "tpp-fintech-app"
  APP_JARM_TTL_SECONDS: "120"
  # Separate PostgreSQL database (PSU credentials) + Argon2id pepper (secret mounted at /etc/psu).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/customer_identity"
  SPRING_DATASOURCE_USERNAME: "user"
  SPRING_DATASOURCE_PASSWORD: ""   # set from secrets/helm-secrets.yaml
  APP_PSU_PEPPER_PATH: "/etc/psu/pepper"
  # Active PSU mechanism (A/B): password (Argon2id) | nipok (RFC 8235) | ... (all values: application.yml). Overridden for measurements.
  APP_PSU_AUTH_ACTIVE_METHOD: "password"
  # Per-IP rate limit against DoS (STRIDE: D). The token limit is HIGH so that the k6 load test (/oauth2/token) is not affected;
  # par/psu are moderate (crypto-heavy, not load-tested). Disable: APP_RATELIMIT_ENABLED=false.
  APP_RATELIMIT_ENABLED: "true"
  APP_RATELIMIT_TOKEN_PER_SEC: "10000"
  APP_RATELIMIT_PAR_PER_SEC: "200"
  APP_RATELIMIT_PSU_PER_SEC: "200"
  # PAR enforcement (RFC 9126) on /oauth2/authorize (blocks a raw-parameter front-channel bypass).
  # off|log|enforce. The legitimate TPP flow uses PAR (request_uri) => enforce is safe. /oauth2/token is NOT affected.
  APP_G10_PAR_MODE: "enforce"
  # POST /psu/register protected by an onboarding token (off|enforce). enforce: the client must send the
  # header X-Onboarding-Token = APP_PSU_ONBOARDING_TOKEN (value generated at deployment, see docs/secrets.md).
  APP_PSU_ONBOARDING_MODE: "enforce"
  APP_PSU_ONBOARDING_TOKEN: ""     # set from secrets/helm-secrets.yaml
  # Access-token TTL (certificate-bound). The self-contained JWT is NOT introspected at the RS => a short TTL is
  # the main defence for a leaked token (together with /oauth2/revoke, RFC 7009). Default 3600 s (does NOT disturb e2e/load).
  APP_TOKEN_TTL_SECONDS: "3600"
  # Ed25519 implementation used to sign access tokens (see docs/ed25519-providers.md).
  # Default CONSCRYPT/BORINGSSL - native, the same engine as Envoy, the fastest in the JMH measurements.
  # Code-level safety fallback: jca-sunec is used automatically if Conscrypt fails to load.
  # Override for benchmarks: --set auth-server.env.APP_ED25519_PROVIDER=<provider-id>
  APP_ED25519_PROVIDER: "conscrypt-boringssl"
  # REQUIRED because the default is Conscrypt (loads the native libconscrypt_openjdk_jni.so on JDK 24).
  # Also needed when APP_ED25519_PROVIDER is libsodium-lazysodium-jna or libsodium-panama-ffm.
  JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
  # Exposes the timer auth_server.ed25519.sign.seconds through /actuator/prometheus for the dashboard.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"

# FIXED resource limits for every provider - the only variable in the benchmarks is the Ed25519 backend.
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

secretVolumes:
  - name: auth-server-jwk
    secretName: auth-server-jwk
    mountPath: /etc/auth
  # JARM keys (K5 private + K6 public). Generated by bank/kubernetes/generate-jarm-keys.sh.
  - name: auth-server-jarm
    secretName: auth-server-jarm
    mountPath: /etc/jarm
  # Argon2id pepper (secret psu-pepper). Created with: openssl rand -base64 32 -> secret.
  - name: psu-pepper
    secretName: psu-pepper
    mountPath: /etc/psu

livenessProbe_enabled: true
readinessProbe_enabled: true

livenessProbe:
  httpGet:
    scheme: HTTP
    path: /actuator/health/liveness
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 20
  failureThreshold: 12
  successThreshold: 1

readinessProbe:
  httpGet:
    scheme: HTTP
    path: /actuator/health/readiness
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  # Note: the application is healthy and fast (token 2-4 ms), but under high load (~1300+ rps) /actuator/health (through Istio
  # :15020) stalls for up to ~12 s -> readiness fails -> pod NotReady -> Istio removes it -> 503 for ~42% of requests (bimodal
  # flapping). The application does NOT fail - the probe gives a false negative. Timeout raised 5->20 s (> the 12 s stall) + failureThreshold
  # 6->10 (period 15 s -> ~150 s of continuous failures before NotReady) -> rides through the load stall, the pod does not flap.
  timeoutSeconds: 20
  failureThreshold: 10
  successThreshold: 1

configmap:
  enabled: true
  volumeMounts:
    mountPath: /config