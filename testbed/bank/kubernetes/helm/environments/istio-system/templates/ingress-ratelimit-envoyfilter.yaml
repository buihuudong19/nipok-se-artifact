# ================================================================================
# EnvoyFilter - local rate limit at the IngressGW (STRIDE: D - against flooding)
#
# local_ratelimit = per-Envoy token bucket, NO external service needed (suits a single ingress).
# Protects in particular /oauth2/token (mTLS handshake + token logic ~56 ms = the most expensive endpoint).
# Above the threshold -> 429. Also limits the headers (against oversized XFCC/certificates).
# Demo threshold: 100 req/s per instance; adjust to the real load.
# ================================================================================
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingress-local-ratelimit
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
  # 1) Request-header size limits (against oversized XFCC/certificate chains)
  - applyTo: NETWORK_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          max_request_headers_kb: 96
          common_http_protocol_options:
            max_headers_count: 100
  # 2) Token-bucket rate limit
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: ingress_local_rl
          token_bucket:
            max_tokens: 100
            tokens_per_fill: 100
            fill_interval: 1s
          filter_enabled:
            default_value: { numerator: 100, denominator: HUNDRED }
          filter_enforced:
            default_value: { numerator: 100, denominator: HUNDRED }
          response_headers_to_add:
          - append_action: OVERWRITE_IF_EXISTS_OR_ADD
            header: { key: x-ratelimited, value: "true" }
