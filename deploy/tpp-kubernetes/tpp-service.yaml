apiVersion: apps/v1
kind: Deployment
metadata: { name: tpp-service, namespace: tpp-cluster-nsp, labels: { app: tpp-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: tpp-service } }
  template:
    metadata: { labels: { app: tpp-service } }
    spec:
      serviceAccountName: tpp-service
      hostAliases:
      - ip: "192.168.49.2"
        hostnames: [ "bank.openbanking.dev" ]
      containers:
      - name: tpp-service
        image: tpp-service:latest
        imagePullPolicy: Never
        ports: [{ containerPort: 8080 }]
        env:
        - { name: TPP_BANK_BASEURL,   value: "https://bank.openbanking.dev:30443" }
        - { name: TPP_BANK_CACERTPATH, value: "/etc/tpp/bank-server-ca.crt" }
        - { name: TPP_VAULT_ADDRESS,  value: "http://vault.vault:8200" }
        volumeMounts:
        - { name: bank-ca, mountPath: /etc/tpp, readOnly: true }
        # P3 — JARM keys: K6 X25519-priv (giải mã) + K5 Ed25519-pub (verify). Secret 'tpp-jarm'.
        - { name: tpp-jarm, mountPath: /etc/tpp-jarm, readOnly: true }
        # G4.1 — TLS server keystore + truststore (validate client cert agent). Secret 'tpp-tls'.
        - { name: tpp-tls, mountPath: /etc/tpp-tls, readOnly: true }
      volumes:
      - { name: bank-ca, secret: { secretName: bank-server-ca } }
      - { name: tpp-jarm, secret: { secretName: tpp-jarm } }
      - { name: tpp-tls, secret: { secretName: tpp-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: tpp-service, namespace: tpp-cluster-nsp }
spec:
  # P1 Authorization Code: expose NodePort 30081 để customer-agent (PSU) tới được /tpp/callback
  # cross-cluster (redirect_uri = http://tpp.openbanking.dev:30081/tpp/callback).
  type: NodePort
  selector: { app: tpp-service }
  ports: [{ port: 80, targetPort: 8080, nodePort: 30081, protocol: TCP, name: http }]
