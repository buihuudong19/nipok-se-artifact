# =============================================================================
# istio-psu-mtls.yaml — Cấu hình Ingress cho PSU-mTLS (Ed25519, TLS 1.3, RFC 8410)
#
# MỤC TIÊU: Envoy IngressGateway thực hiện mTLS handshake với PSU (verify cert Ed25519 theo
# Bank PSU CA), rồi FORWARD chuỗi cert xuống auth-server qua header X-Forwarded-Client-Cert (XFCC).
#
# QUAN HỆ VỚI HẠ TẦNG SẴN CÓ (helm/common/templates/_istio_base.yaml):
#   • Gateway bank-cluster-gw đã ở OPTIONAL_MUTUAL + TLSV1_3  → giữ nguyên, CHỈ bổ sung PSU CA
#     vào trust (caCertificates) để Envoy chấp nhận client cert Ed25519 của PSU.
#   • EnvoyFilter ingress đã SANITIZE_SET (xóa XFCC giả) + set subject/cert/chain → giữ nguyên.
#   • EnvoyFilter sidecar auth-server đã FORWARD_ONLY → giữ nguyên.
#   • mTLS Ed25519 chỉ khả thi ở EDGE (Envoy verify leaf), KHÔNG dùng mesh mTLS (mesh chỉ RSA/ECDSA).
#
# CÁCH ÁP DỤNG: secret 'bank-cluster-certificate' (istio-system) phải có thêm key 'cacert'=ca.crt
# của Bank PSU CA. Khi đó OPTIONAL_MUTUAL verify client cert theo CA này. (Xem setup script.)
# =============================================================================
---
# Bản vá Gateway (chỉ minh hoạ phần tls — merge vào server https của bank-cluster-gw).
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: bank-cluster-gw
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - bank.openbanking.dev
      port:
        name: https
        number: 443
        protocol: HTTPS
      tls:
        # Server cert của Bank + CA tin cậy cho client cert PSU nằm trong CÙNG secret
        # (key 'cacert'). OPTIONAL_MUTUAL: verify nếu client xuất trình cert, không bắt buộc
        # ⟹ A/B testing: password/nipok KHÔNG cần cert vẫn chạy; chỉ mtls mới đính cert.
        credentialName: bank-cluster-certificate
        mode: OPTIONAL_MUTUAL
        minProtocolVersion: TLSV1_3          # RFC 8410 Ed25519 + TLS 1.3 only
---
# (THAM CHIẾU — đã có trong _istio_base.yaml) EnvoyFilter forward XFCC tại Ingress.
# Để ở đây để tài liệu hoá đầy đủ luồng cert; nếu đã tồn tại thì KHÔNG apply trùng.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingress-xfcc-psu-mtls
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            # SANITIZE_SET: XÓA mọi XFCC do client ngoài gửi, rồi GHI bằng giá trị Envoy tự verify
            # (chống Spoofing). Forward Subject + Cert (leaf PEM) + Chain (full chain) xuống app.
            forward_client_cert_details: SANITIZE_SET
            set_current_client_cert_details:
              subject: true
              cert: true
              chain: true
              dns: true
---
# AuthorizationPolicy: chỉ IngressGateway được gọi front-channel PSU-mTLS của auth-server
# ⟹ pod thường KHÔNG tự chèn XFCC giả tới auth-server (delegated-trust boundary).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-auth-server-psu-mtls
  namespace: bank-cluster-nsp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-server
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            paths: ["/oauth2/authorize", "/psu/login-page"]
