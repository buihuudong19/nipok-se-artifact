apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ca-cert
spec:
  isCA: true
  commonName: bank-cluster-ca
  secretName: ca-secret
  duration: 87600h
  renewBefore: 720h
  privateKey:
    {{- include "pki.privateKey" . | nindent 4 }}
  issuerRef:
    name: selfsigned-issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-certificate
spec:
  commonName: grafana.bank.openbanking.dev
  dnsNames:
  - grafana.bank.openbanking.dev
  - kiali.bank.openbanking.dev
  - prometheus.bank.openbanking.dev
  - tracing.bank.openbanking.dev
  duration: 2160h
  renewBefore: 360h
  privateKey:
    {{- include "pki.privateKey" . | nindent 4 }}
  issuerRef:
    name: ca-issuer
  secretName: monitoring-certificate