fullnameOverride: mongodb

image:
  repository: registry.hub.docker.com/library
  name: mongo
  tag: 8.0.5
  pullPolicy: IfNotPresent

ports:
  - containerPort: 27017

configVolumes:
  - name: mongodb-init-script
    configMapName: mongodb-init-script
    mountPath: /docker-entrypoint-initdb.d

service:
  ports:
    - port: 27017
