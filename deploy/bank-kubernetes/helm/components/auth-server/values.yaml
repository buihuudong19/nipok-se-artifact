fullnameOverride: auth-server

image:
  name: auth-server

ports:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

env:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"
  APP_ISSUER_URI: "http://auth-server:80"
  APP_JWK_SET_PATH: "/etc/auth/jwk-set.json"
  # P3 — JARM: K5 (Ed25519 ký, có private) + K6 (X25519 public của TPP). Secret 'auth-server-jarm'
  # mount /etc/jarm — TÁCH HẲN secret 'auth-server-jwk' (khóa token). Sinh bằng generate-jarm-keys.sh.
  APP_JARM_SIGNING_JWK_PATH: "/etc/jarm/jarm-signing.jwk"
  APP_JARM_TPP_ENC_JWK_PATH: "/etc/jarm/tpp-enc-pub.jwk"
  APP_JARM_CLIENT_ID: "tpp-fintech-app"
  APP_JARM_TTL_SECONDS: "120"
  # P5 đợt 1 — PostgreSQL độc lập (credential PSU) + pepper Argon2id (secret mount /etc/psu).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/customer_identity"
  SPRING_DATASOURCE_USERNAME: "user"
  SPRING_DATASOURCE_PASSWORD: "pwd"
  APP_PSU_PEPPER_PATH: "/etc/psu/pepper"
  # P5 — cơ chế PSU đang BẬT (A/B): password (Argon2id) | nipok (RFC 8235). Override khi đo.
  APP_PSU_AUTH_ACTIVE_METHOD: "password"
  # G2 — rate-limit per-IP chống DoS (STRIDE-D). token CAO để KHÔNG phá k6 load-test (/oauth2/token);
  # par/psu vừa phải (crypto-nặng, không load-test). Tắt: APP_RATELIMIT_ENABLED=false.
  APP_RATELIMIT_ENABLED: "true"
  APP_RATELIMIT_TOKEN_PER_SEC: "10000"
  APP_RATELIMIT_PAR_PER_SEC: "200"
  APP_RATELIMIT_PSU_PER_SEC: "200"
  # G10 (RFC 9126) — ép buộc PAR trên /oauth2/authorize (chặn bypass front-channel raw-param).
  # off|log|enforce. Luồng hợp lệ TPP dùng PAR (request_uri) ⟹ enforce an toàn. KHÔNG đụng /oauth2/token.
  APP_G10_PAR_MODE: "enforce"
  # G12 — bảo vệ POST /psu/register bằng onboarding-token (off|enforce). enforce: client phải gửi
  # header X-Onboarding-Token = APP_PSU_ONBOARDING_TOKEN. ⚠ token DEV — prod override qua --set/secret.
  APP_PSU_ONBOARDING_MODE: "enforce"
  APP_PSU_ONBOARDING_TOKEN: "onboarding-dev-secret"
  # G13 — TTL access-token (cert-bound). JWT self-contained KHÔNG introspect ở RS ⟹ TTL ngắn là
  # phòng-thủ-chính cho token bị lộ (cùng /oauth2/revoke RFC 7009). 3600s mặc định (KHÔNG phá e2e/load).
  APP_TOKEN_TTL_SECONDS: "3600"
  # Cài đặt Ed25519 dùng để ký access token (xem docs/ed25519-providers.md).
  # Mặc định CONSCRYPT/BORINGSSL — native, đúng engine Envoy dùng, nhanh nhất theo JMH.
  # Safety fallback ở code-level: jca-sunec sẽ tự được dùng nếu Conscrypt fail load.
  # Override khi bench: --set auth-server.env.APP_ED25519_PROVIDER=<provider-id>
  APP_ED25519_PROVIDER: "conscrypt-boringssl"
  # BẮT BUỘC vì default là Conscrypt (load native libconscrypt_openjdk_jni.so trên JDK 24).
  # Cũng cần khi APP_ED25519_PROVIDER ∈ {libsodium-lazysodium-jna, libsodium-panama-ffm}.
  JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"
  # Expose Timer auth_server.ed25519.sign.seconds qua /actuator/prometheus cho dashboard.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"

# Resource limits CỐ ĐỊNH cho mọi provider — biến duy nhất khi bench là Ed25519 backend.
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

secretVolumes:
  - name: auth-server-jwk
    secretName: auth-server-jwk
    mountPath: /etc/auth
  # P3 — JARM keys (K5 private + K6 public). Sinh bằng bank/kubernetes/generate-jarm-keys.sh.
  - name: auth-server-jarm
    secretName: auth-server-jarm
    mountPath: /etc/jarm
  # P5 đợt 1 — pepper Argon2id (secret psu-pepper). Tạo: openssl rand -base64 32 → secret.
  - name: psu-pepper
    secretName: psu-pepper
    mountPath: /etc/psu

livenessProbe_enabled: true
readinessProbe_enabled: true

livenessProbe:
  httpGet:
    scheme: HTTP
    path: /actuator/health/liveness
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 20
  failureThreshold: 12
  successThreshold: 1

readinessProbe:
  httpGet:
    scheme: HTTP
    path: /actuator/health/readiness
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  # ⚠ App KHỎE+NHANH (token 2-4ms) nhưng dưới tải cao (~1300+ rps) endpoint /actuator/health (qua Istio
  # :15020) bị nghẽn tới ~12s → readiness fail → pod NotReady → Istio rút → 503 cho ~42% request (flap
  # bimodal). App KHÔNG lỗi — probe false-negative. Nới timeout 5→20s (> mức treo 12s) + failureThreshold
  # 6→10 (period 15s → cần ~150s liên tục fail mới NotReady) → cưỡi qua nghẽn tải, pod không flap.
  timeoutSeconds: 20
  failureThreshold: 10
  successThreshold: 1

configmap:
  enabled: true
  volumeMounts:
    mountPath: /config