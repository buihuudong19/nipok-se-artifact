spring:
  application:
    name: payment
server.port: 7005
server.error.include-message: always

spring.r2dbc:
  url: r2dbc:mysql://localhost:3306/payment-db
  username: ${MYSQL_PAYMENT_USERNAME:payment_user}
  password: ${MYSQL_PAYMENT_PASSWORD:payment_password}
  properties:
    createDatabaseIfNotExist: true
    useSSL: false
    allowPublicKeyRetrieval: true

spring.sql.init:
  mode: always
  schema-locations: file:/config/schema.sql

logging:
  level:
    root: INFO
    com.openbanking: DEBUG

management.endpoint.health.probes.enabled: true

server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 10s

---
spring.config.activate.on-profile: docker

server.port: 80

spring.r2dbc:
  url: r2dbc:mysql://mysql:3306/${MYSQL_PAYMENT_DATABASE}
  username: ${MYSQL_PAYMENT_USERNAME}
  password: ${MYSQL_PAYMENT_PASSWORD}
  properties:
    createDatabaseIfNotExist: true
    useSSL: false
    allowPublicKeyRetrieval: true
