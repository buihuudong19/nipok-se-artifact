{{- if .Values.keystoreSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}-keystore
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    helm.sh/chart: {{ include "common.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  edge-test.p12: {{ .Files.Get "keystore/edge-test.p12" | b64enc }}
{{- end }}
