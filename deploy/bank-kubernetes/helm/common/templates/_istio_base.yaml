{{- define "common.istio_base" -}}
# ════════════════════════════════════════════════════════════════════════════════
# SECTION 1 — PeerAuthentication: STRICT mTLS cho toàn namespace
# ════════════════════════════════════════════════════════════════════════════════

# Tất cả traffic trong namespace phải dùng mTLS — không chấp nhận plain HTTP.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
# Spring Cloud Gateway là ClusterIP internal service — KHÔNG nhận traffic từ external.
# External traffic đi qua Istio IngressGateway (NodePort 30443) → VirtualService → services.
# PERMISSIVE giữ lại để gateway có thể nhận cả plain-HTTP từ các client internal
# chưa có sidecar, và mTLS từ các service có sidecar (outbound calls tới aggregators).
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: gateway-permissive
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  mtls:
    mode: PERMISSIVE
---

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 2 — RequestAuthentication: Validate JWT tại sidecar (inline JWKS)
# Istiod KHÔNG cần fetch JWKS từ auth-server → auth-server có thể chạy STRICT mTLS.
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: customer-aggregator-request-authentication
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-aggregator
  jwtRules:
  - forwardOriginalToken: true
    issuer: http://auth-server:80
    jwks: '{{ required "jwtPublicJwks chưa được set — chạy kubernetes/generate-jwk-secret.sh trước" .Values.jwtPublicJwks }}'
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: account-aggregator-request-authentication
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: account-aggregator
  jwtRules:
  - forwardOriginalToken: true
    issuer: http://auth-server:80
    jwks: '{{ required "jwtPublicJwks chưa được set — chạy kubernetes/generate-jwk-secret.sh trước" .Values.jwtPublicJwks }}'
---

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 3 — AuthorizationPolicy: Tầng 1 — Ingress → auth-server & aggregators
#
# Luồng được phép:
#   istio-ingressgateway ──► auth-server   (OAuth2 login, token)
#   istio-ingressgateway ──► customer-aggregator  (API + JWT)
#   istio-ingressgateway ──► account-aggregator   (API + JWT)
#   gateway (Spring GW)  ──► auth-server   (JWKS fetch + OAuth2 proxy)
#   gateway (Spring GW)  ──► customer-aggregator  (API + JWT)
#   gateway (Spring GW)  ──► account-aggregator   (API + JWT)
#   customer-aggregator  ──► auth-server   (JWKS fetch cho Spring Security)
#   account-aggregator   ──► auth-server   (JWKS fetch cho Spring Security)
#
# Principals dùng định dạng SPIFFE:
#   cluster.local/ns/<namespace>/sa/<serviceaccount-name>
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-auth-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-server
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        # Istio IngressGateway → auth-server (OAuth2 authorization code flow, token endpoint)
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
        # Spring Cloud Gateway → auth-server (JWKS fetch + OAuth2 proxy)
        - "cluster.local/ns/bank-cluster-nsp/sa/gateway"
        # Aggregators → auth-server (JWKS fetch để Spring Security validate JWT)
        - "cluster.local/ns/bank-cluster-nsp/sa/customer-aggregator"
        - "cluster.local/ns/bank-cluster-nsp/sa/account-aggregator"
---

# customer-aggregator: phải từ IngressGW hoặc Spring GW VÀ phải có JWT hợp lệ
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-customer-aggregator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-aggregator
  action: ALLOW
  rules:
  # Rule 1: API calls có JWT — từ IngressGW, phải kèm JWT hợp lệ từ auth-server
  - from:
    - source:
        principals:
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
        requestPrincipals: ["http://auth-server:80/*"]
  # Rule 2: API calls có JWT — từ Spring GW, phải kèm JWT hợp lệ từ auth-server
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/gateway"
        requestPrincipals: ["http://auth-server:80/*"]
  # Rule 3: Swagger UI + health (không cần JWT) — chỉ từ IngressGW hoặc Spring GW
  - from:
    - source:
        principals:
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
        - "cluster.local/ns/bank-cluster-nsp/sa/gateway"
    to:
    - operation:
        paths: ["/customer-openapi/*", "/webjars/*", "/actuator/health*"]
---

# account-aggregator: cùng pattern với customer-aggregator
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-account-aggregator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: account-aggregator
  action: ALLOW
  rules:
  # Rule 1: API calls có JWT từ IngressGW
  - from:
    - source:
        principals:
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
        requestPrincipals: ["http://auth-server:80/*"]
  # Rule 2: API calls có JWT từ Spring GW
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/gateway"
        requestPrincipals: ["http://auth-server:80/*"]
  # Rule 3: Swagger UI + health từ IngressGW hoặc Spring GW
  - from:
    - source:
        principals:
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
        - "cluster.local/ns/bank-cluster-nsp/sa/gateway"
    to:
    - operation:
        paths: ["/account-openapi/*", "/webjars/*", "/actuator/health*"]
---

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 4 — AuthorizationPolicy: Tầng 2 — Core Services
#
# Luồng được phép:
#   customer-aggregator ──► customer, account, product, payment, transaction
#   account-aggregator  ──► customer, account, product, payment, transaction
#
# Không cho phép:
#   core service ──► core service (lateral movement bị chặn)
#   external/attacker ──► core service trực tiếp (bypass aggregator)
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-customer-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: customer
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/customer-aggregator"
        - "cluster.local/ns/bank-cluster-nsp/sa/account-aggregator"
---

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-account-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: account
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/customer-aggregator"
        - "cluster.local/ns/bank-cluster-nsp/sa/account-aggregator"
---

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-product-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/customer-aggregator"
        - "cluster.local/ns/bank-cluster-nsp/sa/account-aggregator"
---

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-payment-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/customer-aggregator"
        - "cluster.local/ns/bank-cluster-nsp/sa/account-aggregator"
---

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-transaction-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/customer-aggregator"
        - "cluster.local/ns/bank-cluster-nsp/sa/account-aggregator"
---

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 5 — AuthorizationPolicy: Tầng 3 — Databases
#
# Luồng được phép (nguyên tắc 1 service = 1 database):
#   customer-service ──► mongodb   (port 27017, customer-db)
#   product-service  ──► mongodb   (port 27017, product-db)
#   account-service  ──► postgres  (port 5432)
#   payment-service  ──► mysql     (port 3306)
#   transaction-svc  ──► sqlserver (port 1433)
#
# Tất cả services khác (aggregators, gateway, auth-server) đều bị chặn ở DB layer.
#
# Lưu ý: postgresql chart có Chart.Name="postgresql" nhưng fullnameOverride="postgres"
#   → selector dùng label "postgresql", principal dùng SA name "account" (service SA)
# ════════════════════════════════════════════════════════════════════════════════

# MongoDB: customer-service VÀ product-service (cùng instance, khác database)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-mongodb
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/customer"
        - "cluster.local/ns/bank-cluster-nsp/sa/product"
    to:
    - operation:
        ports: ["27017"]
---

# PostgreSQL: chỉ account-service
# selector dùng Chart.Name "postgresql"; SA của service là "account" (từ fullnameOverride account)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/account"
        # P5 đợt 1 — auth-server → postgres (DB customer_identity: credential PSU).
        - "cluster.local/ns/bank-cluster-nsp/sa/auth-server"
    to:
    - operation:
        ports: ["5432"]
---

# MySQL: chỉ payment-service
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-mysql
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/payment"
    to:
    - operation:
        ports: ["3306"]
---

# SQL Server: chỉ transaction-service
# mssqlserver chart có Chart.Name="sqlserver" và fullnameOverride="sqlserver"
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: authz-sqlserver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sqlserver
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/bank-cluster-nsp/sa/transaction"
    to:
    - operation:
        ports: ["1433"]
---

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 6 — Istio Gateway + VirtualService: TLS termination và routing
# ════════════════════════════════════════════════════════════════════════════════

apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: bank-cluster-gw
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - bank.openbanking.dev
    - health.bank.openbanking.dev
    port:
      name: https
      number: 443
      protocol: HTTPS
    tls:
      credentialName: bank-cluster-certificate
      # OPTIONAL_MUTUAL: đòi+verify client cert NẾU client trình ra (theo CA ở secret
      #   bank-cluster-certificate-cacert — do tpp/scripts/03-publish-ca-to-bank.sh tạo),
      #   nhưng KHÔNG bắt buộc ở tầng TLS → health host + luồng client_secret cũ (writer)
      #   vẫn chạy. Ép-buộc cert theo route (/oauth2/token, /customer-aggregate) để GĐ2.
      mode: OPTIONAL_MUTUAL
      minProtocolVersion: TLSV1_3   # external traffic (client → Ingress) chỉ chấp nhận TLS 1.3
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bank-cluster-vs
spec:
  gateways:
  - bank-cluster-gw
  hosts:
  - bank.openbanking.dev
  http:
  - match:
    - uri:
        prefix: /oauth2
    route:
    - destination:
        host: auth-server
    # Gap-5 — STRIP header channel-binding do CLIENT NGOÀI gửi (chống spoof cb để phá anti-relay NIPoK).
    # Chỉ hop tin cậy (EnvoyFilter) mới được set; client không. (XFCC đã SANITIZE_SET ở ingress.)
    headers:
      request:
        remove:
        - x-forwarded-tls-server-cert-hash
  # G5 — JWKS JARM-sig (TPP fetch verify-key theo kid).
  - match:
    - uri:
        prefix: /jarm
    route:
    - destination:
        host: auth-server
  - match:
    - uri:
        prefix: /login
    route:
    - destination:
        host: auth-server
  - match:
    - uri:
        prefix: /error
    route:
    - destination:
        host: auth-server
  # P5 đợt 1 — PSU auth/register (Argon2id) → auth-server (front-channel login & đăng ký).
  - match:
    - uri:
        prefix: /psu
    route:
    - destination:
        host: auth-server
    # Gap-5 — STRIP header channel-binding client-supplied trên đường /psu (NIPoK login).
    headers:
      request:
        remove:
        - x-forwarded-tls-server-cert-hash
  - match:
    - uri:
        prefix: /customer-aggregate
    route:
    - destination:
        host: customer-aggregator
        port:
          number: 80
  - match:
    - uri:
        prefix: /customer-openapi
    route:
    - destination:
        host: customer-aggregator
        port:
          number: 80
  - match:
    - uri:
        prefix: /account-aggregate
    route:
    - destination:
        host: account-aggregator
        port:
          number: 80
  - match:
    - uri:
        prefix: /account-openapi
    route:
    - destination:
        host: account-aggregator
        port:
          number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: health-vs
spec:
  hosts:
  - "health.bank.openbanking.dev"
  gateways:
  - bank-cluster-gw
  http:
  - route:
    - destination:
        host: customer-aggregator
        port:
          number: 80
---
# ════════════════════════════════════════════════════════════════════════════════
# SECTION 7 — EnvoyFilter: giữ XFCC qua sidecar (RFC 8705 mTLS client auth)
#
# IngressGW set XFCC = cert TPP (kèm Cert=PEM) qua EnvoyFilter ingress-xfcc-forward.
# Nhưng sidecar INBOUND của auth-server mặc định GHI ĐÈ XFCC bằng thông tin mesh-peer
# (cert SPIFFE của ingressgateway) → mất field Cert= → tls_client_auth không thấy cert.
#
# FORWARD_ONLY: sidecar GIỮ NGUYÊN XFCC nhận từ ingress (không sanitize/ghi đè).
# An toàn: nguồn XFCC duy nhất tới được auth-server là ingress (đã SANITIZE_SET lọc
# XFCC ngoài) + AuthorizationPolicy authz-auth-server chặn principal khác.
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: auth-server-xfcc-preserve
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: auth-server
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          forward_client_cert_details: FORWARD_ONLY
---
# customer-aggregator: giữ XFCC để verify cert-bound token (RFC 8705 §3, cnf.x5t#S256).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: customer-aggregator-xfcc-preserve
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: customer-aggregator
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          forward_client_cert_details: FORWARD_ONLY
---
# account-aggregator: cùng pattern.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: account-aggregator-xfcc-preserve
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: account-aggregator
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          forward_client_cert_details: FORWARD_ONLY
---
# ════════════════════════════════════════════════════════════════════════════════
# SECTION 8 — XFCC source trust: chỉ IngressGW được tạo XFCC mà backend tin
#
# Spring GW (app.kubernetes.io/name: gateway) là principal DUY NHẤT khác IngressGW được
# AuthorizationPolicy cho phép tới auth-server/aggregator → là vector duy nhất có thể
# bơm XFCC giả (bypass binding ở aggregator vì XFCC giả mạo được). SANITIZE ở Spring GW
# inbound → app Spring GW không bao giờ thấy/chuyển tiếp XFCC → backend chỉ nhận XFCC do
# IngressGW set (đã verify cert trong phiên TLS thật + ép binding ở 4a).
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: spring-gateway-xfcc-sanitize
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: gateway
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          forward_client_cert_details: SANITIZE
{{- end -}}
